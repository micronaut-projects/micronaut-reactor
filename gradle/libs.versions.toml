[versions]
micronaut = "5.0.0-M26"
micronaut-serde = "3.0.0-M8"
micronaut-tracing = "8.0.0-M1"
micronaut-validation = "5.0.0-M2"
micronaut-platform = "4.10.13"

rxjava3 = "3.1.12"

managed-reactor-bom = "2025.0.5"
managed-micrometer-context-propagation = "1.2.1"

micronaut-gradle-plugin = "4.6.2"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }

boms-reactor = { module = "io.projectreactor:reactor-bom", version.ref = "managed-reactor-bom" }

micronaut-tracing = { module = "io.micronaut.tracing:micronaut-tracing-bom", version.ref = "micronaut-tracing" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }

reactor-core = { module = "io.projectreactor:reactor-core" }
rxjava3 = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava3" }

managed-micrometer-context-propagation = { module = "io.micrometer:context-propagation", version.ref = "managed-micrometer-context-propagation" }

gradle-micronaut = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = "micronaut-gradle-plugin" }
